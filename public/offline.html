<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오프라인</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; font-family: system-ui, sans-serif; color: #1f2937; background: #fff; }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; color: #6b7280; font-size: 14px; line-height: 1.5; }
  button { margin-top: 8px; height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #315eea; color: #fff; font-size: 16px; }
</style>
</head>
<body>
  <h1>네트워크에 연결할 수 없습니다</h1>
  <p>재고 데이터는 서버에서 바로 받아야 하므로 오프라인에서는 사용할 수 없습니다.<br />와이파이 또는 데이터 연결을 확인한 뒤 다시 시도하세요.</p>
  <button onclick="location.reload()">다시 시도</button>
</body>
</html>
